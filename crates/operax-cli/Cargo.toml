[package]
name = "greentic-operax"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "CLI for the Greentic OperaX operational handoff runner."
readme = "README.md"
include = ["build.rs", "src/**", "i18n/**", "Cargo.toml", "README.md"]
publish = false

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.{ archive-format }"
bin-dir = "{ name }-v{ version }-{ target }"
pkg-fmt = "tgz"
bin = ["greentic-operax"]

[[bin]]
name = "greentic-operax"
path = "src/main.rs"

[lib]
name = "operax_cli"
path = "src/lib.rs"

[features]
events = ["dep:async-nats", "dep:tokio", "dep:futures", "dep:greentic-types", "dep:anyhow", "dep:serde"]

[dependencies]
clap.workspace = true
operax-audit.workspace = true
operax-core.workspace = true
operax-dispatch.workspace = true
operax-manager.workspace = true
operax-pack-loader.workspace = true
operax-policy.workspace = true
operax-runtime.workspace = true
operax-sorx-http.workspace = true
serde_json.workspace = true
greentic-pack.workspace = true
zip.workspace = true
async-nats = { version = "0.46", optional = true }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"], optional = true }
futures = { version = "0.3", optional = true }
greentic-types = { version = "1.1", features = ["serde"], optional = true }
anyhow = { version = "1", optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
chrono = { version = "0.4", default-features = false }
