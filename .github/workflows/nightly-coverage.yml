name: Nightly Coverage
on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"

permissions:
  contents: read

concurrency:
  group: nightly-coverage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout greentic-pack dependency
        uses: actions/checkout@v4
        with:
          repository: greenticai/greentic-pack
          path: .greentic-deps/greentic-pack
      - name: Link greentic-pack dependency
        run: ln -s "$GITHUB_WORKSPACE/.greentic-deps/greentic-pack" "$GITHUB_WORKSPACE/../greentic-pack"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      - name: Install coverage tools
        env:
          # binstall resolves releases through api.github.com. Unauthenticated
          # requests are rate-limited per runner IP; on a 403 binstall does NOT
          # fail, it silently falls back to `cargo install <tool>` from source
          # WITHOUT --locked. cargo-nextest has a deliberate compile_error! that
          # rejects exactly that, so the job burns ~11 min compiling then exits
          # 70. Authenticating lifts the limit (see greenticai/greentic-cap #39).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # rust-cache restores ~/.cargo/.crates.toml but prunes ~/.cargo/bin of
          # binstall-installed binaries, so binstall says "already installed"
          # while the binary is gone. --force sidesteps that.
          #
          # --disable-strategies compile turns the source-build fallback into a
          # hard, fast failure instead of a silent degradation. All three tools
          # publish prebuilt binaries, so the compile strategy is never the
          # legitimate path here.
          cargo binstall -y --force --disable-strategies compile cargo-nextest
          cargo binstall -y --force --disable-strategies compile cargo-llvm-cov
          cargo binstall -y --force --disable-strategies compile greentic-dev
          command -v cargo-nextest
          command -v cargo-llvm-cov
          command -v greentic-dev
          greentic-dev --version
      - run: greentic-dev coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-coverage-report
          path: target/coverage/coverage.json
          if-no-files-found: ignore
